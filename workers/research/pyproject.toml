[project]
name = "mapforce-research-worker"
version = "0.1.0"
description = "Temporal activity worker for provider adapters (mock by default)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "temporalio==1.18.2",
]

[dependency-groups]
dev = [
  "jsonschema==4.25.1",
  "mypy==1.18.2",
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
  "ruff==0.14.0",
  "types-jsonschema==4.25.1.20251009",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_worker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
