[project]
name = "mapforce-research-worker"
version = "0.1.0"
description = "Temporal activity worker for provider adapters (mock by default)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiohttp==3.14.5",
  "temporalio==1.34.0",
]

[dependency-groups]
dev = [
  "jsonschema==4.26.0",
  "mypy==2.4.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.17.0",
  "types-jsonschema==4.26.0.20261006",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_worker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
